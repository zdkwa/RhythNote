[package]
name = "rhythnote"
version = "0.1.3"
description = "RhythNote — local-first personal task and rhythm app"
authors = ["RhythNote"]
edition = "2021"
default-run = "rhythnote"

[lib]
name = "rhythnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
